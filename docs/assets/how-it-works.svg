<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="ht hd" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <title id="ht">How Angles works</title>
  <desc id="hd">Admin keeps the catalog, an operator sends a job to a station, the phone relays it, the paired watch shows one angle at a time.</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8aa397"/></marker></defs>
  <rect width="1200" height="230" rx="18" fill="#f5f7fa"/>
  
  <g transform="translate(30,50)">
    <rect width="250" height="120" rx="14" fill="#ffffff" stroke="#d6dde3"/>
    <g transform="translate(18,20) scale(1.3)" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M7 10h4M7 13h7"/></g>
    <text x="60" y="40" font-size="17" font-weight="700" fill="#1a1a1a">Catalog</text>
    <text x="18" y="76" font-size="13" fill="#555">Admins keep holds, MAIN /</text>
    <text x="18" y="96" font-size="13" fill="#555">STEFAN angles, drawings.</text>
  </g>
  
  <path d="M282 110H338" stroke="#8aa397" stroke-width="2" marker-end="url(#ar)"/>
  <text x="310.0" y="80" text-anchor="middle" font-size="11" fill="#6b8577">select holds</text>
  
  <g transform="translate(340,50)">
    <rect width="250" height="120" rx="14" fill="#ffffff" stroke="#d6dde3"/>
    <g transform="translate(18,20) scale(1.3)" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7v10M6 7c0 4 4 5 10 5"/></g>
    <text x="60" y="40" font-size="17" font-weight="700" fill="#1a1a1a">Station job</text>
    <text x="18" y="76" font-size="13" fill="#555">A send goes to one saw or</text>
    <text x="18" y="96" font-size="13" fill="#555">operator. No overwrites.</text>
  </g>
  
  <path d="M592 110H648" stroke="#8aa397" stroke-width="2" marker-end="url(#ar)"/>
  <text x="620.0" y="80" text-anchor="middle" font-size="11" fill="#6b8577">sync</text>
  
  <g transform="translate(650,50)">
    <rect width="250" height="120" rx="14" fill="#ffffff" stroke="#d6dde3"/>
    <g transform="translate(18,20) scale(1.3)" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"/></g>
    <text x="60" y="40" font-size="17" font-weight="700" fill="#1a1a1a">Phone</text>
    <text x="18" y="76" font-size="13" fill="#555">Garmin Connect relays a</text>
    <text x="18" y="96" font-size="13" fill="#555">compact copy (~3.5 KB).</text>
  </g>
  
  <path d="M902 110H958" stroke="#8aa397" stroke-width="2" marker-end="url(#ar)"/>
  <text x="930.0" y="80" text-anchor="middle" font-size="11" fill="#6b8577">Bluetooth</text>
  
  <g transform="translate(960,50)">
    <rect width="210" height="120" rx="14" fill="#ffffff" stroke="#d6dde3"/>
    <g transform="translate(18,20) scale(1.3)" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3"/><path d="M12 9.5V12l1.8 1.2"/></g>
    <text x="60" y="40" font-size="17" font-weight="700" fill="#1a1a1a">Watch</text>
    <text x="18" y="76" font-size="13" fill="#555">One angle per screen,</text>
    <text x="18" y="96" font-size="13" fill="#555">one press per cut.</text>
  </g>
  <text x="600" y="210" text-anchor="middle" font-size="12" fill="#6b8577">Catalog behind a workshop code · watches paired with a 6-digit code · cut marks stay on each watch</text>
</svg>
